name: Sync Momence sessions

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay a few minutes)
  workflow_dispatch:         # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: sync-momence
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch sessions from Momence
        run: node scripts/fetch-sessions.mjs
        env:
          MOMENCE_HOST_ID: ${{ secrets.MOMENCE_HOST_ID }}
          MOMENCE_TOKEN: ${{ secrets.MOMENCE_TOKEN }}
          SESSION_TYPES: ${{ vars.SESSION_TYPES }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD }}
          LOCATION: ${{ vars.LOCATION }}

      - name: Commit if changed
        run: |
          git config user.name "momence-sync"
          git config user.email "actions@users.noreply.github.com"
          git add docs/sessions.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync Momence sessions"
            git push
          fi
